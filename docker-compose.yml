x-spring-environment: &spring-environment
  SERVER_PORT: 8080
  DB_HOST: ${DB_HOST_FOR_CONTAINER:-host.docker.internal}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-startingblock}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-startingblock}
  MYSQL_HOST: ${DB_HOST_FOR_CONTAINER:-host.docker.internal}
  MYSQL_PORT: ${DB_PORT:-3306}
  MYSQL_USER: ${DB_USERNAME:-root}
  MYSQL_PASSWORD: ${DB_PASSWORD:-startingblock}
  MYSQL_DB_NAME: ${DB_NAME:-startingblock}
  QDRANT_URL: http://127.0.0.1:6333
  QDRANT_HTTP_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-announcement_chunks}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
  KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-local-disabled}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-local-disabled}
  KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:18200/login/oauth2/code/kakao}
  SOURCE_DIR: /app/processed_file
  EMBEDDING_MODEL_LOCAL_PATH: /data/embedding-models/intfloat__multilingual-e5-large-instruct
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_AUTO_START: ${OLLAMA_AUTO_START:-false}
  AI_RAG_PYTHON_EXECUTABLE: /opt/ai-rag-venv/bin/python
  AI_RAG_WORKING_DIRECTORY: /app/ai-rag
  TZ: Asia/Seoul

x-spring-common: &spring-common
  build:
    context: .
  image: startingblock-spring:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  expose:
    - "8080"
    - "6333"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./processed_file:/app/processed_file:ro
    - /data/embedding-models:/data/embedding-models
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  proxy:
    build:
      context: ./deploy/nginx
    image: startingbloakc:nginx
    container_name: startingblock-proxy
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-18200}:18200"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  spring-blue:
    <<: *spring-common
    container_name: startingblock-spring-blue
    environment:
      <<: *spring-environment
      SERVICE_COLOR: blue
      QDRANT_STORAGE_PATH: /data/qdrant
    volumes:
      - ./processed_file:/app/processed_file:ro
      - /data/embedding-models:/data/embedding-models
      - /data/qdrant-blue:/data/qdrant

  spring-green:
    <<: *spring-common
    container_name: startingblock-spring-green
    profiles:
      - green
    environment:
      <<: *spring-environment
      SERVICE_COLOR: green
      QDRANT_STORAGE_PATH: /data/qdrant
    volumes:
      - ./processed_file:/app/processed_file:ro
      - /data/embedding-models:/data/embedding-models
      - /data/qdrant-green:/data/qdrant
